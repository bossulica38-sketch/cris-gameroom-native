name: Windows desktop release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - 'Localization/**'
      - 'installer/nsis/**'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        include:
          - arch: x64
            rid: win-x64
          - arch: x86
            rid: win-x86
    steps:
      - name: Preia sursele
        uses: actions/checkout@v4

      - name: Instalează .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurează dependențele
        run: dotnet restore CrisGameRoom.csproj -r ${{ matrix.rid }}

      - name: Compilează aplicația WPF
        run: dotnet publish CrisGameRoom.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o installer/staging/${{ matrix.rid }}

      - name: Compilează actualizatorul
        run: dotnet publish CrisGameRoomUpdater/CrisGameRoomUpdater.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o installer/staging/${{ matrix.rid }}/updater

      - name: Normalizează fișierele publicate
        shell: pwsh
        run: |
          $stage = "installer/staging/${{ matrix.rid }}"
          $app = Get-ChildItem $stage -Filter JocuriSiDiscutii.exe -File -Recurse | Select-Object -First 1
          $updater = Get-ChildItem "$stage/updater" -Filter CrisGameRoomUpdater.exe -File -Recurse | Select-Object -First 1
          if (!$app) { Get-ChildItem $stage -Recurse | Select-Object FullName; throw "Executabilul aplicației lipsește din $stage" }
          if (!$updater) { Get-ChildItem $stage -Recurse | Select-Object FullName; throw "Executabilul actualizatorului lipsește din $stage/updater" }
          Copy-Item $app.FullName "$stage/JocuriSiDiscutii.exe" -Force
          New-Item -ItemType Directory -Force "$stage/updater" | Out-Null
          Copy-Item $updater.FullName "$stage/updater/CrisGameRoomUpdater.exe" -Force
          Get-Item "$stage/JocuriSiDiscutii.exe", "$stage/updater/CrisGameRoomUpdater.exe" | Select-Object FullName,Length

      - name: Instalează NSIS
        run: choco install nsis -y --no-progress

      - name: Creează installerul
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/output | Out-Null
          if ('${{ matrix.arch }}' -eq 'x64') {
            & "C:\Program Files (x86)\NSIS\makensis.exe" installer/nsis/JocuriSiDiscutii-x64.nsi
          } else {
            & "C:\Program Files (x86)\NSIS\makensis.exe" installer/nsis/JocuriSiDiscutii-x86.nsi
          }

      - name: Verifică pachetul
        shell: pwsh
        run: |
          $file = "installer/output/JocuriSiDiscutii-Setup-${{ matrix.arch }}.exe"
          if (!(Test-Path $file)) { throw "Installerul lipsește: $file" }
          $item = Get-Item $file
          if ($item.Length -lt 10MB) { throw "Installer suspect de mic: $($item.Length) bytes" }
          Get-FileHash $file -Algorithm SHA256 | Format-List

      - name: Publică artefactul descărcabil
        uses: actions/upload-artifact@v4
        with:
          name: JocuriSiDiscutii-Setup-${{ matrix.arch }}
          path: installer/output/JocuriSiDiscutii-Setup-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 30
